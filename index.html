<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ÉLAN | Modern Fashion Store</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets (one file per part) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>

  <!-- ========== PART 2: HEADER ========== -->
  <div class="top-bar">Free shipping on orders over $75</div>

  <header class="header">
    <div class="container">
      <a href="#top" class="brand">ÉLAN</a>

      <nav class="nav">
        <a href="#clothing">Clothing</a>
        <a href="#footwear">Footwear</a>
        <a href="#accessories">Accessories</a>
        <a href="#top" class="sale-link">Sale</a>
      </nav>

      <div class="icons">
        <a href="#" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </a>
        <a href="#" aria-label="Shopping bag">
          <svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span class="count">2</span>
        </a>
      </div>
    </div>
  </header>

  <main id="top">

    <!-- ========== PART 3: HERO BANNER ========== -->
    <section class="hero">
      <div class="container hero-inner">
        <div class="hero-content">
          <p class="eyebrow">Autumn / Winter 2026</p>
          <h1>The New Collection</h1>
          <p>Layered knits, sharp jackets and everyday essentials. Up to 40% off selected styles.</p>
          <a href="#clothing" class="btn">SHOP NOW</a>
        </div>
      </div>
      <div class="hero-badge"><span>UP TO</span><strong>40%</strong><span>OFF</span></div>
    </section>

  </main>

</body>
</html>
